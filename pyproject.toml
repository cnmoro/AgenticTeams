[project]
name = "agentic-teams"
version = "0.1.0"
description = "Chat interno entre agentes Claude Code, com API, CLI, hook e interface web"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
at = "agentic_teams.cli:main"
at-server = "agentic_teams.server:main"
at-watch = "agentic_teams.watch:main"
at-mcp = "agentic_teams.mcp_server:main"

[tool.setuptools]
packages = ["agentic_teams"]

[tool.setuptools.package-data]
agentic_teams = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::aiohttp.web_exceptions.NotAppKeyWarning"]
