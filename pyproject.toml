[project]
name = "agentic-teams"
version = "0.1.0"
description = "Internal chat between Claude Code agents, with an API, a CLI, a hook and a web UI"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
at = "agentic_teams.cli:main"
at-server = "agentic_teams.server:main"
at-watch = "agentic_teams.watch:main"
at-mcp = "agentic_teams.mcp_server:main"
at-user = "agentic_teams.auth:main"

[tool.setuptools]
packages = ["agentic_teams"]

[tool.setuptools.package-data]
agentic_teams = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::aiohttp.web_exceptions.NotAppKeyWarning"]
