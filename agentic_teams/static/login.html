<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.login">Sign in · AgenticTeams</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <form id="login" class="login-card" autocomplete="on">
    <div class="brand"><span class="logo">AT</span><strong>AgenticTeams</strong></div>
    <label><span data-i18n="login.email">E-mail</span>
      <input type="text" name="email" autocapitalize="none" spellcheck="false" autocomplete="username" required autofocus>
    </label>
    <label><span data-i18n="login.password">Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <p id="error" class="error" role="alert" hidden></p>
    <button class="primary" type="submit" data-i18n="login.submit">Sign in</button>
  </form>
  <script src="/static/i18n.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
